<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pokémon Battle Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <span class="ball" aria-hidden="true"></span>
    <h1>Battle Predictor</h1>
    <p class="tag">Pick two Pokémon. See who the model bets on.</p>
  </header>

  <main class="arena">
    <!-- Fighter A -->
    <section class="slot" id="slot-a">
      <select class="pick" data-side="a" aria-label="Choose the first Pokémon">
        <option value="">Choose a Pokémon</option>
        {% for p in pokedex %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
      <div class="fighter empty">
        <img class="sprite" alt="">
        <h2 class="fname">—</h2>
        <div class="stats"></div>
      </div>
    </section>

    <div class="mid">
      <span class="vs">VS</span>
      <button id="battle" disabled>Battle</button>
    </div>

    <!-- Fighter B -->
    <section class="slot" id="slot-b">
      <select class="pick" data-side="b" aria-label="Choose the second Pokémon">
        <option value="">Choose a Pokémon</option>
        {% for p in pokedex %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
      </select>
      <div class="fighter empty">
        <img class="sprite" alt="">
        <h2 class="fname">—</h2>
        <div class="stats"></div>
      </div>
    </section>
  </main>

  <section id="result" hidden>
    <p class="verdict"></p>
  </section>

  <script>
    const POKEDEX = {{ pokedex | tojson }};
    const BY_ID = Object.fromEntries(POKEDEX.map(p => [p.id, p]));
    const STATS = ["HP", "Attack", "Defense", "Sp. Atk", "Sp. Def", "Speed"];
    const MAX = 200; // for stat bar scaling
    // grey poké-ball placeholder when a sprite is missing
    const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><circle cx="48" cy="48" r="40" fill="none" stroke="#4b515e" stroke-width="6"/><line x1="8" y1="48" x2="88" y2="48" stroke="#4b515e" stroke-width="6"/><circle cx="48" cy="48" r="12" fill="#14161c" stroke="#4b515e" stroke-width="6"/></svg>');

    const chosen = { a: null, b: null };

    function renderFighter(side) {
      const slot = document.getElementById("slot-" + side);
      const box = slot.querySelector(".fighter");
      const p = chosen[side];
      if (!p) { box.classList.add("empty"); return; }
      box.classList.remove("empty");
      const img = box.querySelector(".sprite");
      img.alt = p.name;
      img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER; };
      img.src = p.img || PLACEHOLDER;
      box.querySelector(".fname").textContent = p.name;
      box.querySelector(".stats").innerHTML = STATS.map(s => {
        const v = p.stats[s];
        return `<div class="stat"><span>${s}</span>
          <span class="bar"><i style="width:${Math.min(100, v / MAX * 100)}%"></i></span>
          <b>${v}</b></div>`;
      }).join("");
    }

    document.querySelectorAll(".pick").forEach(sel => {
      sel.addEventListener("change", e => {
        const side = e.target.dataset.side;
        chosen[side] = BY_ID[e.target.value] || null;
        renderFighter(side);
        document.getElementById("battle").disabled = !(chosen.a && chosen.b);
        document.getElementById("result").hidden = true;
      });
    });

    document.getElementById("battle").addEventListener("click", async () => {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ first: chosen.a.id, second: chosen.b.id }),
      });
      const d = await res.json();
      const box = document.getElementById("result");
      box.querySelector(".verdict").innerHTML =
        `<strong>${d.winner_name}</strong> takes it — model confidence ${d.win_prob}%`;
      box.hidden = false;
      box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
    });
  </script>
</body>
</html>
